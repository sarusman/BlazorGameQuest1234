
services:
  blazor-client:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: blazorgamequest1234
    ports:
      - "5050:5050"
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_URLS=http://+:5050
    restart: unless-stopped
    networks:
      - blazor-network

networks:
  blazor-network:
    driver: bridge