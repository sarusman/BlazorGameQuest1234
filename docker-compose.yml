services:
  # backend
  gameservice:
    build:
      context: .
      dockerfile: BlazorGame.GameService/Dockerfile
    ports:
      - "8080:8080"
    environment:
      - ASPNETCORE_URLS=http://+:8080
      - ASPNETCORE_ENVIRONMENT=Development
    networks:
      - appnet

  #frontend
  client:
    build:
      context: .
      dockerfile: BlazorGame.Client/Dockerfile
    ports:
      - "5003:80"
    depends_on:
      - gameservice
    networks:
      - appnet

  keycloak:
    image: quay.io/keycloak/keycloak:26.1.0
    container_name: keycloak
    ports:
      - "8180:8080"
    environment:
      - KC_BOOTSTRAP_ADMIN_USERNAME=admin
      - KC_BOOTSTRAP_ADMIN_PASSWORD=admin
      - KEYCLOAK_FRONTEND_URL=http://localhost:8180
      - KC_HOSTNAME=localhost
      - KC_HOSTNAME_PORT=8180
      - KC_HOSTNAME_STRICT_BACKCHANNEL=false
      - KC_HTTP_ENABLED=true
      - KC_HOSTNAME_STRICT_HTTPS=false
      - KC_HEALTH_ENABLED=true
    volumes:
      - keycloak-data:/opt/keycloak/data
    command: ["start-dev"]
    networks:
      - appnet

  api-gateway:
    build: 
      context: .
      dockerfile: ApiGateway/Dockerfile
    container_name: api_gateway_gamequest
    ports:
      - "5001:5001" #port d'écoute l'hote et port du conteneur
    depends_on:
      - gameservice
    networks:
      - appnet

  keycloak-auth-service:
    build:
      context: .
      dockerfile: KeycloakAuthService/Dockerfile
    container_name: keycloak_auth_service_blazor
    ports:
      - "5051:5051" #port d'écoute l'hote et port du conteneur
    networks:
      - appnet
  

volumes:
  keycloak-data:

networks:
  appnet:
    driver: bridge
